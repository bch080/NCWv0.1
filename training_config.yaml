# NCW v0.1 LoRA 训练配置（LlamaFactory）
base_model: Qwen2.5-7B-Instruct
finetuning_type: lora
load_in_8bit: true

dataset: ncw_essay
cutoff_len: 1536
val_size: 0.05

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

learning_rate: 1e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0

bf16: true
gradient_checkpointing: true
seed: 42
